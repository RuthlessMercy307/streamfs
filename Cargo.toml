[workspace]
resolver = "2"
members = ["crates/core", "crates/sim", "crates/bench", "crates/gdrive", "crates/mount", "crates/volume", "crates/server", "crates/http", "crates/codec", "crates/overlay"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
async-trait = "0.1"
bytes = "1"
thiserror = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
hdrhistogram = "7"

[profile.release]
debug = 1
